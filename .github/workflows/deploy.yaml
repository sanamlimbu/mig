name: Build and deploy API server in EC2.

on:
  push:
    branches: ['main']
    paths:
      - server/**
  workflow_dispatch:

jobs:
  build:
    name: Build Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'server/go.mod'
          cache-dependency-path: 'server/go.sum'

      - name: Build server binary
        working-directory: ./server
        run: |
          GOOS=linux GOARCH=amd64 go build -v -o ../bin/mig-server ./cmd/server/main.go

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mig-server
          path: ./bin/mig-server

  deploy:
    name: Deploy Go
    runs-on: ubuntu-latest
    needs: build
    env:
      EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Download Go binary
        uses: actions/download-artifact@v4
        with:
          name: mig-server

      - name: Set up SSH for EC2
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

      - name: Copy binary to EC2
        run: ~
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ./mig-server $EC2_USER@$EC2_HOST:~

      - name: SSH into EC2 and start the server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            chmod +x mig-server
            sudo systemctl stop mig-server
            sudo cp mig-server /usr/local/bin/
            sudo systemctl start mig-server
          EOF
